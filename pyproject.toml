[project]
name = "mishpat"
version = "0.1.0"
description = "Headless Selenium CLI + MCP for AI-agent web testing (screenshots in terminal, no visible browser)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.30.0",
    "fastmcp>=3.1.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
]
